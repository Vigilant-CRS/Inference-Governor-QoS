name: CI

on:
  push:
    branches: [main]
  pull_request:

# Die CI liest, sonst nichts. Ohne diesen Block gaelte das Standardrecht des
# Repositories, und ein kompromittierter Schritt koennte schreiben. Die Actions
# sind auf Commit-SHAs gepinnt; Dependabot schlaegt Aktualisierungen vor.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # Der Scheduling-Kern hat kein I/O und keine Uhr — er laeuft im Emulator
  # vollstaendig. Damit faellt eine Architekturabhaengigkeit hier auf und nicht
  # erst beim Release oder, schlimmer, auf dem Geraet des Kunden.
  #
  # Das ist **keine** Hardwarequalifikation: es belegt gleiche Entscheidungen,
  # nicht gleiche Laufzeiten. Was auf echter Hardware gemessen werden muss,
  # steht in docs/hardware-qualification.md.
  cross-aarch64:
    name: aarch64 (emulated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: aarch64
      - run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler gcc-aarch64-linux-gnu qemu-user-static
      - env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static -L /usr/aarch64-linux-gnu
        run: |
          cargo test -p vig-core --target aarch64-unknown-linux-gnu
          cargo build -p vig-cli --target aarch64-unknown-linux-gnu

  supply-chain:
    name: licenses / advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans advisories sources

  # Gate S ist ein Produktgate, kein optionaler Bericht: eine Regression im
  # Scheduling muss den Build brechen, nicht erst beim naechsten manuellen Lauf
  # auffallen.
  gate-s:
    name: gate s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo run --release -p vig-sim --bin gate-s | tee gate-s.log
      # In Anfuehrungszeichen: ein `": "` in einem unquotierten YAML-Skalar
      # macht die Zeile zu einer Zuordnung und die Datei ungueltig.
      - run: 'grep -q "Gate S: bestanden" gate-s.log'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-s-report
          path: docs/benchmark/gate-s-report.md

  # Spec 21.2: REUSE-Konformitaet als eigener, nicht optionaler Schritt.
  reuse:
    name: reuse lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
