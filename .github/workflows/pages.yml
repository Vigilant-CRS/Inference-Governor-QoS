name: Pages

# Die Projektseite zeigt dieselben Dokumente, die im Repository liegen: jede
# Zahl auf der Startseite verlinkt auf ihren Bericht, und die Berichte selbst
# sind Unterseiten. Gebaut wird mit einem Skript und einer Abhaengigkeit
# (site/build.py, markdown), damit niemand eine zweite Wahrheit pflegen muss.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur was das Deployment braucht. Schreibrechte auf den Inhalt gibt es nicht.
permissions:
  contents: read
  pages: write
  id-token: write

# Ein laufendes Deployment wird nicht abgebrochen; ein neueres wartet.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r site/requirements.txt
      - run: python site/build.py --out _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
