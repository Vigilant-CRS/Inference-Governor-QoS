# Gate-M3-Analogon auf der GPU eines Pixel 2: GESAETTIGT, ABER PLANBAR, mit ZWEI Slots.
#
# Fuer `vig autotune` mit Tuning-Schritt (ADR-0045). Die Vertraege liegen
# zwischen vig-slots2-overload.yaml (geschuetzt 70 %, bei zwei Slots nicht
# gesaettigt) und vig-slots2-heavy.yaml (141 %, `vig doctor` NOT_READY — auf
# einer unerfuellbaren Zusage kann keine Einstellung etwas gewinnen): alle drei
# Perioden von Overload mit 0,74 multipliziert, also rund 95 % geschuetzte
# Auslastung. `vig-fit` faehrt davon 100 bis 125 % und saettigt damit die zwei
# Slots. Profile, Interferenz und `no_corun` stammen aus der Kalibrierung vom
# 11.09.; autotune misst sie neu.
version: 1
backend:
  type: oip
  grpc_endpoint: 127.0.0.1:8001
  slots: 2
  pipelining_depth: 0
  no_corun:
  - - pose
    - depth
  safety_margin_percent: 110
  inference_timeout_ms: 30000
  trust: open
  max_inflight_mib: 512
  interference:
  - victim: depth
    co_tenant: detector
    added_us: 51155
  - victim: detector
    co_tenant: depth
    added_us: 116347
  miss_aware_policy: false
  prediction: shadow
  security:
    shm_key_prefix: /vig_
    max_shm_regions: 256
    transport:
      max_concurrent_streams: 256
      concurrency_per_connection: 64
      request_timeout_ms: 600000
      keepalive_interval_ms: 30000
      keepalive_timeout_ms: 10000
models:
  depth:
    class: high
    queue:
      policy: latest
      capacity: 1
      overflow: reject_new
    contract:
      period_ms: 740
      deadline_ms: 740
      max_age_ms: 1480
      variant_dwell_ms: 100
    variants:
    - id: main
      backend_model: depth
      quality:
        value: 1.0
        source: user_declared
      profile:
        p50_us: 199642
        p95_us: 208416
        p99_us: 217830
        samples: 200
        fingerprint: 0e1f8ee6932fd4cb
        manifest:
          revision: 2
          recorded_at: 2026-09-11T19:17:59Z
          artifact: {}
          runtime:
            server: vig-tflite
            server_version: 0.1.0
            platform: tflite_gpu
          device: {}
          resources: {}
          measurement:
            dataset: zeros
            batch_size: 1
            concurrency: 1
            warmup: 20
            independent_runs: 1
          validity: {}
    stateful: false
    decoupled: false
  detector:
    class: protected
    queue:
      policy: latest
      capacity: 1
      overflow: reject_new
    contract:
