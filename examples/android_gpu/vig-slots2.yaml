          device: {}
          resources: {}
          measurement:
            dataset: zeros
            batch_size: 1
            concurrency: 1
            warmup: 20
            independent_runs: 1
          validity: {}
    stateful: false
    decoupled: false
  pose:
    class: high
    queue:
      policy: latest
      capacity: 1
      overflow: reject_new
    contract:
      period_ms: 500
      deadline_ms: 500
      max_age_ms: 1000
