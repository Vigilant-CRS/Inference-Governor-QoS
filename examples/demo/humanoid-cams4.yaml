# Demo "Humanoid robot": Kopfkamera, Brustkamera und zwei Handgelenkkameras,
# jede durch RF-DETR Medium (576 px), daneben SmolVLM, das die Szene fuer die
# Aufgabenplanung beschreibt — auf einer RTX 3070 Laptop.
#
# Last: 4 Kameras x 30 Bilder/s x 19 ms = rund 230 % einer GPU.
#
# Vertraege: die Kopfkamera ist geschuetzt — Menschen im Arbeitsraum. Bei
# 1 m/s Arm- oder Koerperbewegung ist ein Ergebnis nach 100 ms 10 cm alt.
# Brust- und Handgelenkkameras sind `normal` mit derselben Frische; das
# Sprachbildmodell ist best_effort.
version: 1
backend:
  type: triton
  grpc_endpoint: "127.0.0.1:9501"
  slots: 2
  pipelining_depth: 0
  safety_margin_percent: 110
models:
  head:
    class: protected
    queue: { policy: latest, capacity: 1 }
    contract: { period_ms: 33, deadline_ms: 66, max_age_ms: 100, variant_dwell_ms: 300 }
    variants:
      - id: medium
        backend_model: rfdetr_medium
        quality: { value: 1.00, source: user_declared }
        # vig profile, 200 Laeufe, 15.09.2026
        profile: { p50_us: 19017, p95_us: 20653, p99_us: 21774, samples: 200 }
  chest:
    class: normal
    queue: { policy: latest, capacity: 1 }
    contract: { period_ms: 33, deadline_ms: 66, max_age_ms: 100 }
    variants:
      - id: medium
        backend_model: rfdetr_medium
        quality: { value: 1.00, source: user_declared }
        profile: { p50_us: 19017, p95_us: 20653, p99_us: 21774, samples: 200 }
  left_wrist:
    class: normal
    queue: { policy: latest, capacity: 1 }
    contract: { period_ms: 33, deadline_ms: 66, max_age_ms: 100 }
    variants:
      - id: medium
        backend_model: rfdetr_medium
        quality: { value: 1.00, source: user_declared }
        profile: { p50_us: 19017, p95_us: 20653, p99_us: 21774, samples: 200 }
  right_wrist:
    class: normal
    queue: { policy: latest, capacity: 1 }
    contract: { period_ms: 33, deadline_ms: 66, max_age_ms: 100 }
    variants:
      - id: medium
        backend_model: rfdetr_medium
        quality: { value: 1.00, source: user_declared }
        profile: { p50_us: 19017, p95_us: 20653, p99_us: 21774, samples: 200 }
  vlm:
    class: best_effort
    backend_endpoint: "127.0.0.1:9601"
    queue: { policy: fifo, capacity: 2, overflow: backpressure_client }
    contract: { deadline_ms: 5000, max_age_ms: 8000, min_runtime: { budget_ms: 300, window_ms: 1000 } }
    variants:
      - id: main
        backend_model: smolvlm
        quality: { value: 1.00, source: user_declared }
        # demo-record profile-vlm, 100 Aufrufe, hoechstens 5 Token, 15.09.2026
        profile: { p50_us: 121474, p95_us: 156447, p99_us: 170257, samples: 100 }
