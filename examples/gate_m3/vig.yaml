# Gate-M3-Konfiguration: echte Modelle auf einer echten GPU.
#
# Modellrepository und Startbefehl: deploy/triton/README.md
# Die Profile stammen aus `vig profile` und gelten nur fuer die dort
# vermerkte Umgebung (Spec 13.5):
#   RTX 3070 Laptop, Treiber 580.173.02, Triton 2.70.0 (26.06-py3),
#   onnxruntime-Backend, neu gemessen am 2026-09-10 mit 200 Laeufen je Modell.
#
# Die Zahlen vom 2026-09-01 lagen niedriger (Detektor 14 916 statt 15 639 us).
# Dieselbe Karte, dieselben Gewichte — der Unterschied ist der Zustand der
# Karte, nicht das Modell. Genau dafuer traegt das gemessene Profil ein
# Manifest (ADR-0019); diese Vorlage traegt nur die Quantile.
#
# Geschuetzte serialisierte Auslastung: 103 % mit den Zahlen vom 2026-09-10.
#
# **`vig doctor` lehnt diese Datei deshalb ab**, und das ist beabsichtigt: sie
# beschreibt eine Ueberlast, ueber der ein Slot nicht tragen kann. Genau darum
# geht es in Gate M3 — der Bereich, in dem sich entscheidet, ob Steuerung etwas
# bringt. Als Vorlage fuer einen echten Aufbau taugt sie nicht; wer sie
# uebernimmt, muss Perioden oder Kapazitaet anpassen, bis `doctor` gruen ist.
#
# Am 2026-09-01 lag dieselbe Konfiguration bei 92 % und `doctor` warnte nur.
# Gewechselt hat nicht das Szenario, sondern der Zustand der Karte.
#
# Seit dem 16.09.2026 nennt `doctor` einen zweiten Grund: das VLM rechnet
# 110 ms, der Detektor verspricht 66 ms Hoechstalter, und auf einem einzigen
# regulaeren Slot laeuft ein begonnener Aufruf ohne Praemption zu Ende
# (ADR-0035). Gemessen: ein Slot und ein langer Auftrag rissen die Versorgung
# auf 234 ms, zwei Slots hielten sie bei 39 ms. Der Weg heraus steht in
# vig-preemptible.yaml — hier bleibt die Datei, wie sie ist, weil sie eine
# gemessene Hardwarelage beschreibt und nicht als Vorlage gedacht ist.
version: 1

backend:
  type: triton
  grpc_endpoint: "127.0.0.1:8001"
  slots: 1
  # Ein Auftrag darf schon unterwegs sein, bevor die Antwort auf den vorigen
  # da ist. Ohne das laeuft die GPU zwischen zwei Auftraegen leer, und genau
  # bei 100 % Last kostet das Abdeckung (188 statt 17 Promille, Messung vom
  # 12.09.). Gate M3 kostet es nichts (docs/benchmark/abnahme-2026-09-12.md).
  pipelining_depth: 1
  safety_margin_percent: 110
  # Der lange VLM-Block darf die zeitkritische Wahrnehmung nicht begleiten.
  no_corun:
    - [detector, vlm]

models:
  # RF-DETR bei 512 px - das tatsaechliche Detektionsmodell, kein Stellvertreter.
  detector:
    class: protected
    queue: { policy: latest, capacity: 1 }
    contract: { period_ms: 33, deadline_ms: 33, max_age_ms: 66, variant_dwell_ms: 200 }
    variants:
      - id: rfdetr
        backend_model: rfdetr
        quality: { value: 1.00, source: user_declared }
        profile: { p50_us: 15639, p95_us: 18074, p99_us: 19596, samples: 200, fingerprint: "e28f0fd746353b16" }

  pose:
    class: high
    queue: { policy: latest, capacity: 1 }
    contract: { period_ms: 33, deadline_ms: 33, max_age_ms: 66 }
    variants:
      - id: main
        backend_model: pose_main
        quality: { value: 1.00, source: user_declared }
        profile: { p50_us: 4082, p95_us: 5163, p99_us: 5690, samples: 200, fingerprint: "8db797d424217c67" }

  depth:
    class: high
    queue: { policy: latest, capacity: 1 }
    contract: { period_ms: 66, deadline_ms: 66, max_age_ms: 132 }
    variants:
      - id: main
        backend_model: depth_main
        quality: { value: 1.00, source: user_declared }
        profile: { p50_us: 9286, p95_us: 10612, p99_us: 11453, samples: 200, fingerprint: "655a85407254e2a1" }

  # Ein langer, nicht unterbrechbarer Block - das Verhalten eines VLM auf der
  # GPU. **Kein Sprachmodell:** es ist dieselbe ResNet-50 wie `depth`, nur mit
  # Batch 48 statt 4 — bytegleiches Artefakt, nachpruefbar am Digest. Ein
  # echtes VLM haette hier dieselbe Wirkung und waere schwerer reproduzierbar.
  vlm:
    class: best_effort
    queue: { policy: fifo, capacity: 4, overflow: backpressure_client }
    contract: { deadline_ms: 800, max_age_ms: 1500 }
    variants:
      - id: main
        backend_model: vlm_main
        quality: { value: 1.00, source: user_declared }
        profile: { p50_us: 97902, p95_us: 105105, p99_us: 109996, samples: 200, fingerprint: "af0d78dfb5032a91" }
