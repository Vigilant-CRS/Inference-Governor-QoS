[package]
name = "onetimer-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OneTimer OIP gateway: gRPC front end and scheduler actor"

[dependencies]
onetimer-core = { path = "../onetimer-core", version = "0.1.0" }
onetimer-config = { path = "../onetimer-config", version = "0.1.0" }
onetimer-protocol-oip = { path = "../onetimer-protocol-oip", version = "0.1.0" }
onetimer-backend-triton = { path = "../onetimer-backend-triton", version = "0.1.0" }
tonic = "0.14.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
axum = "0.8.9"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tokio-stream = { version = "0.1.19", features = ["net"] }

[lints]
workspace = true
