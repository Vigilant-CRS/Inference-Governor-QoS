[package]
name = "onetimer-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OneTimer command line interface"

[[bin]]
name = "onetimer"
path = "src/main.rs"

[dependencies]
onetimer-core = { path = "../onetimer-core", version = "0.1.0" }
onetimer-config = { path = "../onetimer-config", version = "0.1.0" }
onetimer-protocol-oip = { path = "../onetimer-protocol-oip", version = "0.1.0" }
onetimer-backend-triton = { path = "../onetimer-backend-triton", version = "0.1.0" }
onetimer-gateway = { path = "../onetimer-gateway", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tonic = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
