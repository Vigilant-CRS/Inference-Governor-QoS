[package]
name = "vig-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Open Inference Protocol gateway with shared-memory passthrough"

[dependencies]
vig-core = { path = "../vig-core", version = "0.1.0" }
vig-config = { path = "../vig-config", version = "0.1.0" }
vig-protocol-oip = { path = "../vig-protocol-oip", version = "0.1.0" }
vig-backend-triton = { path = "../vig-backend-triton", version = "0.1.0" }
vig-platform = { path = "../vig-platform", version = "0.1.0" }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
axum = "0.8.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tokio-stream = { version = "0.1.19", features = ["net"] }

[lints]
workspace = true
