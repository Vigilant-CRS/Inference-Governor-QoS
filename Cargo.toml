[workspace]
resolver = "3"
members = [
    "crates/vig-core",
    "crates/vig-backend-triton",
    "crates/vig-bench",
    "crates/vig-cli",
    "crates/vig-config",
    "crates/vig-gateway",
    "crates/vig-protocol-oip",
    "crates/vig-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "BUSL-1.1"
authors = ["Vigilant e.K. <info@vigilant-crs.de>"]
repository = "https://github.com/Vigilant-CRS/Inference-QoS"
description = "Inference QoS for edge robotics: a freshness- and deadline-aware governor in front of NVIDIA Triton"

# Siehe Spec 26.4 (Coding-Regeln) und docs/adr/.
# Diese Lints sind bewusst als deny konfiguriert: sie kodieren die
# Sicherheitsinvarianten des Schedulers, nicht nur Stilfragen.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Spec 26.4: kein unwrap/expect, checked arithmetic, keine unbounded Aufnahme.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "deny"
arithmetic_side_effects = "deny"
float_cmp = "deny"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Produktnamen wie Vigilant/Triton/NVIDIA stehen in nahezu jedem
# Doc-Kommentar; Backticks waeren hier Rauschen statt Praezision.
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
