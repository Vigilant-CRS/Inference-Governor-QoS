# tonic, hyper und tower haben tiefe Aufrufketten. Im Debug-Build wird nichts
# geinlined, wodurch ein einzelner gRPC-Aufruf mehr als die 2 MiB Stack
# verbraucht, die der Testlaeufer einem Testthread standardmaessig gibt.
#
# Das ist keine Eigenschaft unseres Codes: die beteiligten Futures sind
# gemessen 2-3 KB gross (siehe `report_future_sizes`). Auch im Release-Build
# reicht der Standardstack nicht fuer jeden Test: `datapath_budgets_hold`
# laeuft direkt aufgerufen, ohne `cargo test`, ueber (docs/benchmark/
# arm-serve.md). Wer ein Testbinary direkt startet, setzt denselben Wert.
# Er steht hier und nicht als Umgebungsvariable in einer Anleitung, die jeder
# neue Entwickler und die CI erst finden muessten.
[env]
RUST_MIN_STACK = "16777216"
