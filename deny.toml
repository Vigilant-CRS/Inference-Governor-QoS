# cargo-deny Konfiguration.
# Umsetzung der Lizenz-Allowlist aus Spec 20.8 und der Supply-Chain-Tests
# aus Spec 21. Konservative Engineering-Policy, keine juristische Aussage.

[graph]
all-features = true

[licenses]
version = 2
# Spec 20.8, "initial automatisch erlauben".
# MPL-2.0, LGPL-, EPL-Varianten sind bewusst NICHT gelistet: sie erfordern
# manuelle Pruefung und muessen einzeln mit Begruendung ergaenzt werden.
# GPL/AGPL/SSPL/BUSL/RSAL/Commons Clause bleiben blockiert.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
]
confidence-threshold = 0.93

# Spec 20.8 sieht fuer Lizenzen ausserhalb der Allowlist eine manuelle Pruefung
# vor. Diese Liste ist das Ergebnis dieser Pruefung — bewusst als Einzelfall je
# Crate und nicht als Erweiterung der globalen Allowlist, damit eine neue
# Dependency mit derselben Lizenz erneut geprueft werden muss.
#
# Beide Lizenzen sind permissiv, OSI-approved und ohne Reziprozitaets- oder
# Offenlegungspflicht. Technische Produktplanung, keine Rechtsberatung — vor
# kommerzieller Distribution ist eine formale juristische Pruefung noetig.
exceptions = [
    # Zlib: permissiv, dreiklauselig, keine Namensnennungspflicht in Binaries.
    # Transitive Abhaengigkeit ueber hashbrown.
    { name = "foldhash", allow = ["Zlib"] },
    # Unicode-3.0 deckt die eingebetteten Unicode-Datentabellen. Der Code selbst
    # steht unter MIT OR Apache-2.0. Transitive Abhaengigkeit ueber syn/quote.
    { name = "unicode-ident", allow = ["Unicode-3.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Spec 26.4: keine unbounded Puffer, keine globale Mega-State-Struktur.
# Diese Crates wuerden Muster einschleppen, die der Scheduler-Core ausschliesst.
deny = []

[advisories]
version = 2
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
